<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shorts Autoposter</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js"></script>
</head>
<body>
<main>
<div class="auth card">
  <h1 id="h">Log in</h1>
  <p id="setupText" class="muted hidden">Create the first account. You can add your friend's account later in Settings.</p>
  <div id="flash" class="flash hidden"></div>
  <form id="f">
    <label for="u">Username</label><input id="u" type="text" autocomplete="username" required autofocus>
    <label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required>
    <p><button id="go" type="submit">Log in</button></p>
  </form>
</div>
</main>
<script>
(async () => {
  const me = await api("/api/me");
  if (me.data.user) { location.href = "/"; return; }
  const setup = me.data.needsSetup;
  if (setup) {
    document.getElementById("h").textContent = "Welcome 👋";
    document.getElementById("setupText").classList.remove("hidden");
    document.getElementById("go").textContent = "Create account";
    document.getElementById("p").autocomplete = "new-password";
  }
  document.getElementById("f").addEventListener("submit", async e => {
    e.preventDefault();
    const go = document.getElementById("go"); go.disabled = true;
    const r = await api(setup ? "/api/setup" : "/api/login", { json: { username: document.getElementById("u").value, password: document.getElementById("p").value } });
    go.disabled = false;
    if (r.ok) location.href = setup ? "/settings.html?msg=" + encodeURIComponent("Account created. Next: connect YouTube and Instagram.") : "/";
    else flash(r.data.error || "Something went wrong.", true);
  });
})();
</script>
</body>
</html>
