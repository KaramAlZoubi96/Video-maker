<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Queue · Shorts HQ</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js"></script>
</head>
<body class="hidden">
<main>
  <div id="flash" class="flash hidden"></div>
  <div id="problems"></div>
  <div class="head">
    <h1>Your queue</h1>
    <a class="btn big" id="newBtn" href="/upload.html">+ New video</a>
  </div>
  <div class="ptabs" id="tabs"></div>
  <div id="page"></div>
</main>
<script>
let DATA = null, TZ = "UTC";
let current = (() => { try { return localStorage.getItem("page") || "p1"; } catch (_) { return "p1"; } })();
const NAMES = { youtube: "YouTube", instagram: "Instagram" };
const SHORT = { youtube: "YT", instagram: "IG" };

function postDots(v) {
  return Object.entries(v.posts).map(([pl, p]) => {
    if (p.status === "published") return p.url ? `<a class="d ok" href="${esc(p.url)}" target="_blank" rel="noopener">${SHORT[pl]} ✓</a>` : `<span class="d ok">${SHORT[pl]} ✓</span>`;
    if (p.status === "uploading") return `<span class="d up">${SHORT[pl]} ↑</span>`;
    if (p.status === "failed") return `<span class="d bad">${SHORT[pl]} ✕</span>`;
    return `<span class="d">${SHORT[pl]}</span>`;
  }).join("");
}

const fmtN = n => n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M" : n >= 1e3 ? (n / 1e3).toFixed(1).replace(/\.0$/, "") + "k" : String(n);

function statsLine(v) {
  const ps = Object.values(v.posts).map(p => p.stats).filter(Boolean);
  if (!ps.length) return "";
  const views = ps.reduce((n, x) => n + (x.views || 0), 0), likes = ps.reduce((n, x) => n + (x.likes || 0), 0);
  return `<div class="m">👁 ${fmtN(views)} &nbsp; ❤ ${fmtN(likes)}</div>`;
}

function statsTitle(v) {
  return Object.entries(v.posts).filter(([, p]) => p.stats).map(([pl, p]) =>
    `${NAMES[pl]}: ${p.stats.views ?? "?"} views, ${p.stats.likes ?? "?"} likes, ${p.stats.comments ?? "?"} comments${p.stats.note ? " (" + p.stats.note + ")" : ""}`).join("\n");
}

function notes(v) {
  let h = "";
  for (const [pl, p] of Object.entries(v.posts)) {
    if (p.status === "failed") h += `<div class="err">${NAMES[pl]}: ${esc(p.lastError)} <button class="ghost" style="padding:4px 10px;margin-top:4px" onclick="act('${v.id}','retry/${pl}')">Retry</button></div>`;
    else if (v.releasedAt && p.status !== "published" && (p.note || p.lastError)) h += `<div class="muted">${NAMES[pl]}: ${esc(p.note || "")}${p.nextAttemptAt ? " · next try " + fmtTime(p.nextAttemptAt, TZ) : ""}</div>`;
  }
  if (v.status === "uploading") h += `<div class="muted">Upload not finished. Upload it again if this stays.</div>`;
  if (v.credit) h += `<div class="muted">📖 <a href="${esc(v.credit.url)}" target="_blank" rel="noopener">u/${esc(v.credit.author)}</a>${v.credit.permission ? " · permission ✓" : ""}</div>`;
  return h ? `<div class="notes">${h}</div>` : "";
}

function tile(v, kind, i, total) {
  const label = kind === "queued" ? `<span class="num">#${i + 1}</span>` : kind === "active" ? `<span class="num live">LIVE</span>` : "";
  const meta = kind === "done" ? fmtDate(v.releasedAt, TZ) : `by ${esc(v.uploader)} · ${Math.round(v.duration)}s`;
  let acts = "";
  if (kind === "queued") {
    acts = `${v.status === "ready" ? `<button onclick="if(confirm('Post this video now?'))act('${v.id}','post-now')">Post now</button>` : ""}
      <span class="grow"></span>
      <button class="icon" title="Move earlier" ${i === 0 ? "disabled" : ""} onclick="act('${v.id}','move',{direction:-1})">↑</button>
      <button class="icon" title="Move later" ${i === total - 1 ? "disabled" : ""} onclick="act('${v.id}','move',{direction:1})">↓</button>`;
  }
  const del = `<button class="icon" title="Delete" onclick="if(confirm('Remove this video from the website? (Already-published posts stay online.)'))act('${v.id}','delete')">🗑</button>`;
  const edit = kind === "queued" ? `<details><summary>Edit text</summary>
      <form onsubmit="event.preventDefault();act('${v.id}','edit',{title:this.t.value,description:this.d.value})">
        <label>Title</label><input name="t" type="text" maxlength="100" required value="${esc(v.title)}">
        <label>Caption</label><textarea name="d" maxlength="2000">${esc(v.description)}</textarea>
        <p><button type="submit">Save</button></p>
      </form></details>` : "";
  return `<div class="tile">
    <div class="pic">${label}<img src="/api/thumb/${v.id}" alt="" loading="lazy" onerror="this.remove()">
      <div class="ov" title="${esc(statsTitle(v))}"><div class="t">${esc(v.title)}</div><div class="m">${meta}</div>${statsLine(v)}<div class="dots">${postDots(v)}</div></div></div>
    ${notes(v)}
    <div class="acts">${acts || '<span class="grow"></span>'}${del}</div>
    ${edit}
  </div>`;
}

function section(title, list, kind, emptyText) {
  if (!list.length && !emptyText) return "";
  return `<h2>${title}</h2>` + (list.length
    ? `<div class="grid">${list.map((v, i) => tile(v, kind, i, list.length)).join("")}</div>`
    : `<div class="empty">${emptyText}</div>`);
}

function render() {
  const d = DATA;
  if (!d.pages.find(p => p.id === current)) current = d.pages[0].id;
  document.getElementById("problems").innerHTML = d.problems.map(p => `<div class="banner">⚠ ${esc(p)} <a href="/settings.html">Fix in Settings</a></div>`).join("");
  document.getElementById("tabs").innerHTML = d.pages.map(p =>
    `<button class="${p.id === current ? "on" : ""}" onclick="pick('${p.id}')">${esc(p.name)} <span class="count">${p.queued.length}</span></button>`).join("");
  const p = d.pages.find(x => x.id === current);
  document.getElementById("newBtn").href = "/upload.html?page=" + p.id;
  const acc = [p.accounts.youtube && "YouTube " + p.accounts.youtube, p.accounts.instagram && "Instagram " + p.accounts.instagram].filter(Boolean).join(" · ");
  const next = p.nextSlot
    ? `<div class="next"><div class="clock">⏰</div><div><b>Next drop: ${fmtTime(p.nextSlot, TZ)}</b><small>${p.queued[0] ? `"${esc(p.queued[0].title)}" goes out` : "Nothing waiting. Upload a video for this page."}${acc ? " · " + esc(acc) : ""}</small></div></div>`
    : `<div class="next"><div class="clock">⏸</div><div><b>No posting times for ${esc(p.name)}</b><small>Videos only post when you press "Post now". <a href="/settings.html">Set times</a></small></div></div>`;
  let stats = "";
  if (p.publishedCount) {
    const best = p.bestTimes.length
      ? `<div class="small" style="margin-top:10px"><b>Best posting times</b> (average views per video)<div class="times">${p.bestTimes.slice(0, 5).map((t, i) =>
          `<div class="trow"><span>${i === 0 ? "🏆 " : ""}${t.time}</span><span class="bar"><i style="width:${Math.max(4, Math.round(t.avgViews / Math.max(1, p.bestTimes[0].avgViews) * 100))}%"></i></span><span>${fmtN(t.avgViews)} <span class="muted">· ${t.videos} video${t.videos > 1 ? "s" : ""}</span></span></div>`).join("")}</div>
          <div class="muted small">Tip: try a few different times for 2–3 weeks, then keep the best ones in Settings.</div></div>`
      : `<div class="muted small" style="margin-top:8px">Numbers show up a few hours after posting.</div>`;
    stats = `<div class="card statsbox"><div class="statrow">
        <div><b>${fmtN(p.totals.youtubeViews)}</b><span>YouTube views</span></div>
        <div><b>${fmtN(p.totals.instagramViews)}</b><span>Instagram views</span></div>
        <div><b>${fmtN(p.totals.likes)}</b><span>Likes</span></div>
        <div><b>${p.publishedCount}</b><span>Posted</span></div></div>
      ${best}
      <div class="muted small" style="margin-top:8px">${p.lastStatsRun ? "Updated " + fmtDate(p.lastStatsRun, TZ) + " · " : ""}<button class="link" onclick="refreshStats()">Update now</button></div></div>`;
  }
  document.getElementById("page").innerHTML = next + stats
    + section("Posting now", p.active, "active")
    + section(`Up next (${p.queued.length})`, p.queued, "queued", `No videos waiting for ${esc(p.name)}. <a href="/upload.html?page=${p.id}">Upload one</a>`)
    + section(`Posted (${p.publishedCount})`, p.done, "done");
  window.__busy = d.pages.some(x => x.active.length);
}

async function refreshStats() {
  flash("Updating numbers…", false);
  const r = await api("/api/stats/refresh", { json: {} });
  flash(r.ok ? r.data.message : (r.data.error || "Could not update numbers."), !r.ok);
  await load();
}

function pick(id) { current = id; try { localStorage.setItem("page", id); } catch (_) {} render(); }

async function act(id, action, data = {}) {
  const r = await api(`/api/videos/${id}/${action}`, { json: data });
  if (!r.ok) flash(r.data.error || "Something went wrong.", true);
  else if (r.data.message) flash(r.data.message, false);
  await load();
}

async function load() {
  const r = await api("/api/dashboard");
  if (!r.ok) return;
  DATA = r.data; TZ = r.data.timezone;
  render();
}

(async () => {
  if (!(await requireUser())) return;
  showUrlMessages();
  await load();
  setInterval(() => { if (window.__busy && !document.querySelector("details[open]")) load(); }, 10000);
})();
</script>
</body>
</html>
