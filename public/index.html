<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Queue · Shorts HQ</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js"></script>
</head>
<body class="hidden">
<main>
  <div class="head">
    <h1>Queue</h1>
    <a class="btn dark" id="newBtn" href="/upload.html">+ New video</a>
  </div>
  <div id="flash" class="flash hidden"></div>
  <div id="problems"></div>
  <div class="ptabs" id="tabs"></div>
  <div id="page"></div>
</main>
<script>
let DATA = null, TZ = "UTC";
let current = new URLSearchParams(location.search).get("page") || (() => { try { return localStorage.getItem("page") || "p1"; } catch (_) { return "p1"; } })();
const NAMES = { youtube: "YouTube", instagram: "Instagram" };
const SHORT = { youtube: "YT", instagram: "IG" };

function postDots(v) {
  return Object.entries(v.posts).map(([pl, p]) => {
    if (p.status === "published") return p.url ? `<a class="d ok" href="${esc(p.url)}" target="_blank" rel="noopener">${SHORT[pl]} ✓</a>` : `<span class="d ok">${SHORT[pl]} ✓</span>`;
    if (p.status === "uploading") return `<span class="d up">${SHORT[pl]} ↑</span>`;
    if (p.status === "failed") return `<span class="d bad">${SHORT[pl]} ✕</span>`;
    return `<span class="d">${SHORT[pl]}</span>`;
  }).join("");
}

const fmtN = n => n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M" : n >= 1e3 ? (n / 1e3).toFixed(1).replace(/\.0$/, "") + "k" : String(n);

function statsLine(v) {
  const ps = Object.values(v.posts).map(p => p.stats).filter(Boolean);
  if (!ps.length) return "";
  const views = ps.reduce((n, x) => n + (x.views || 0), 0), likes = ps.reduce((n, x) => n + (x.likes || 0), 0);
  return `<div class="m">👁 ${fmtN(views)} &nbsp; ❤ ${fmtN(likes)}</div>`;
}

function statsTitle(v) {
  return Object.entries(v.posts).filter(([, p]) => p.stats).map(([pl, p]) =>
    `${NAMES[pl]}: ${p.stats.views ?? "?"} views, ${p.stats.likes ?? "?"} likes, ${p.stats.comments ?? "?"} comments${p.stats.note ? " (" + p.stats.note + ")" : ""}`).join("\n");
}

function notes(v) {
  let h = "";
  for (const [pl, p] of Object.entries(v.posts)) {
    if (p.status === "failed") h += `<div class="err">${NAMES[pl]}: ${esc(p.lastError)} <button class="ghost" style="padding:4px 10px;margin-top:4px" onclick="act('${v.id}','retry/${pl}')">Retry</button></div>`;
    else if (v.releasedAt && p.status !== "published" && (p.note || p.lastError)) h += `<div class="muted">${NAMES[pl]}: ${esc(p.note || "")}${p.nextAttemptAt ? " · next try " + fmtTime(p.nextAttemptAt, TZ) : ""}</div>`;
  }
  if (v.status === "uploading") h += `<div class="muted">Upload not finished. Upload it again if this stays.</div>`;
  if (v.credit) h += `<div class="muted">📖 <a href="${esc(v.credit.url)}" target="_blank" rel="noopener">u/${esc(v.credit.author)}</a>${v.credit.permission ? " · permission ✓" : ""}</div>`;
  return h ? `<div class="notes">${h}</div>` : "";
}

/** One video as a list row (design: Clean Studio). kind: queued | active | done | unfinished */
function row(v, kind, i, total) {
  const label = kind === "queued" ? `#${i + 1}` : kind === "active" ? "LIVE" : "";
  const meta = kind === "done" ? `by ${esc(v.uploader)} · posted ${fmtDate(v.releasedAt, TZ)}` : `by ${esc(v.uploader)} · ${formatLen(v.duration)}`;
  const waitingApproval = v.approval === "pending" || v.approval === "changes";
  let pills = "";
  if (kind === "active") pills += `<span class="d up">● Posting</span>`;
  if (kind === "queued" && v.approval === "pending") pills += `<span class="d wait">⏳ Needs approval</span>`;
  if (kind === "queued" && v.approval === "changes") pills += `<span class="d bad">✏️ Sent back</span>`;
  if (kind === "queued" && v.scheduledAt) pills += `<span class="d">🗓 ${fmtDate(v.scheduledAt, TZ)}</span>`;
  pills += postDots(v);

  let ra = "";
  const del = `<button class="icon" title="Delete" onclick="if(confirm('Remove this video from the website? (Already-published posts stay online.)'))act('${v.id}','delete')">🗑</button>`;
  if (kind === "queued" && v.approval === "pending") {
    const mine = v.uploader === DATA.me;
    ra = `<button onclick="approve('${v.id}', ${mine})">Approve</button><button class="ghost" onclick="watch('${v.id}')">Watch</button>`;
  } else if (kind === "queued") {
    ra = `${v.status === "ready" ? `<button class="icon" title="Watch" onclick="watch('${v.id}')">▶</button>
      <button class="icon" title="Set a date and time" onclick="setTime('${v.id}', ${v.scheduledAt ? `'${v.scheduledAt}'` : "null"})">🗓</button>` : ""}
      ${v.status === "ready" && !waitingApproval ? `<button onclick="if(confirm('Post this video now?'))act('${v.id}','post-now')">Post now</button>` : ""}`;
  } else if (kind === "unfinished") {
    ra = del;
  }
  const more = kind === "queued" ? `<details><summary>More</summary>
      <div class="actions" style="margin:8px 0">
        <button class="ghost" ${i === 0 ? "disabled" : ""} onclick="act('${v.id}','move',{direction:-1})">↑ Earlier</button>
        <button class="ghost" ${i === total - 1 ? "disabled" : ""} onclick="act('${v.id}','move',{direction:1})">↓ Later</button>
        ${v.approval === "pending" ? `<button class="ghost" onclick="sendBack('${v.id}')">✏️ Send back</button>` : ""}
        ${del}
      </div>
      <form onsubmit="event.preventDefault();act('${v.id}','edit',{title:this.t.value,description:this.d.value})">
        <label>Title</label><input name="t" type="text" maxlength="100" required value="${esc(v.title)}">
        <label>Caption</label><textarea name="d" maxlength="2000">${esc(v.description)}</textarea>
        <p><button class="dark" type="submit">Save text</button></p>
      </form></details>` : kind === "done" || kind === "active" ? `<details><summary>More</summary><div class="actions" style="margin:8px 0">${del}</div></details>` : "";
  let approval = "";
  if (kind === "queued" && v.approval === "pending" && v.uploader !== DATA.me) {
    approval = `<div class="approve">⏳ <b>${esc(v.uploader)}</b> made this. Watch it, then tap <b>Approve</b> — or <a href="#" onclick="event.preventDefault();sendBack('${v.id}')">send it back</a> with a note.</div>`;
  } else if (kind === "queued" && v.approval === "changes") {
    approval = `<div class="approve changes">✏️ <b>Sent back by ${esc(v.approvedBy || "")}:</b> ${esc(v.approvalNote || "")}<br>
      <span class="muted">Fix the text under “More” (it goes back for approval), make a new video, or
      <a href="#" onclick="event.preventDefault();approve('${v.id}', true)">approve it anyway</a>.</span></div>`;
  }
  return `<div class="row">
    <span class="num ${kind === "active" ? "live" : ""}">${label}</span>
    <img class="thumb" src="/api/thumb/${v.id}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
    <div class="x" title="${esc(statsTitle(v))}">
      <div class="t">${esc(v.title)}</div>
      <div class="m">${meta}</div>
      ${statsLine(v)}
      <div class="dots">${pills}</div>
      ${approval}${notes(v)}${more}
    </div>
    <div class="ra">${ra}</div>
  </div>`;
}

const formatLen = (s) => `${Math.floor((s || 0) / 60)}:${String(Math.round((s || 0) % 60)).padStart(2, "0")}`;

function list(title, items, emptyText, right = "") {
  if (!items.length && !emptyText) return "";
  return `<div class="list"><div class="lh">${title}<span>${right}</span></div>`
    + (items.length ? items.join("") : `<div class="empty" style="border:0;border-radius:0">${emptyText}</div>`) + `</div>`;
}

function render() {
  const d = DATA;
  if (!d.pages.find(p => p.id === current)) current = d.pages[0].id;
  document.getElementById("problems").innerHTML = (d.toApprove ? `<div class="banner ok">⏳ <b>${d.toApprove} ${d.toApprove === 1 ? "video is" : "videos are"} waiting for your approval.</b> Watch and tap Approve.</div>` : "")
    + d.problems.map(p => `<div class="banner">⚠ ${esc(p)} <a href="/settings.html">Fix in Settings</a></div>`).join("");
  document.getElementById("tabs").innerHTML = d.pages.map(p =>
    `<button class="${p.id === current ? "on" : ""}" onclick="pick('${p.id}')">${esc(p.name)} <span class="count">${p.queued.length}</span>${p.queued.some((v) => v.approval === "pending" && v.uploader !== d.me) ? " ⏳" : ""}</button>`).join("");
  const p = d.pages.find(x => x.id === current);
  document.getElementById("newBtn").href = "/upload.html?page=" + p.id;
  const toApprove = p.queued.filter((v) => v.approval === "pending" && v.uploader !== d.me).length;
  const nextDay = p.nextSlot ? new Date(p.nextSlot).toLocaleDateString(undefined, { timeZone: TZ, weekday: "long" }) : "";
  const isToday = p.nextSlot && new Date(p.nextSlot).toDateString() === new Date().toDateString();
  const views = p.totals.youtubeViews + p.totals.instagramViews;
  const kpis = `<div class="kpis">
    <div class="kpi"><span>Next post</span><b>${p.nextSlot ? new Date(p.nextSlot).toLocaleTimeString(undefined, { timeZone: TZ, hour: "2-digit", minute: "2-digit" }) : "—"}</b>
      <small class="${p.nextSlot ? "" : "muted"}">${p.nextSlot ? (isToday ? "today" : nextDay) : '<a href="/settings.html">set posting times</a>'}</small></div>
    <div class="kpi"><span>Views (all posts)</span><b>${fmtN(views)}</b><small class="muted">YT ${fmtN(p.totals.youtubeViews)} · IG ${fmtN(p.totals.instagramViews)}</small></div>
    <div class="kpi"><span>Waiting</span><b>${p.queued.length}</b><small class="muted">${p.queued[0] ? "next: " + esc(p.queued[0].title.slice(0, 28)) + (p.queued[0].title.length > 28 ? "…" : "") : "queue is empty"}</small></div>
    <div class="kpi"><span>To approve</span><b>${toApprove}</b><small class="muted">${p.publishedCount} posted so far</small></div>
  </div>`;
  let stats = "";
  if (p.publishedCount) {
    const best = p.bestTimes.length
      ? `<div class="small" style="margin-top:4px"><b>Best posting times</b> <span class="muted">(average views per video)</span><div class="times">${p.bestTimes.slice(0, 5).map((t, i) =>
          `<div class="trow"><span>${i === 0 ? "🏆 " : ""}${t.time}</span><span class="bar"><i style="width:${Math.max(4, Math.round(t.avgViews / Math.max(1, p.bestTimes[0].avgViews) * 100))}%"></i></span><span>${fmtN(t.avgViews)} <span class="muted">· ${t.videos} video${t.videos > 1 ? "s" : ""}</span></span></div>`).join("")}</div>
          <div class="muted small">Tip: try a few different times for 2–3 weeks, then keep the best ones in Settings.</div></div>`
      : `<div class="muted small">Numbers show up a few hours after posting.</div>`;
    stats = `<div class="card statsbox">${best}
      <div class="muted small" style="margin-top:8px">${esc(fmtN(p.totals.likes))} likes in total · ${p.lastStatsRun ? "updated " + fmtDate(p.lastStatsRun, TZ) + " · " : ""}<button class="link" onclick="refreshStats()">Update now</button></div></div>`;
  }
  const upNext = [...p.active.map((v) => row(v, "active", 0, 1)), ...p.queued.map((v, i) => row(v, "queued", i, p.queued.length))];
  document.getElementById("page").innerHTML = kpis
    + list("Unfinished uploads", (p.unfinished || []).map((v) => row(v, "unfinished", 0, 1)), "", "upload again, or delete")
    + list("Up next", upNext, `No videos waiting for ${esc(p.name)}. <a href="/upload.html?page=${p.id}">Upload one</a> or <a href="/stories.html">make one from a story</a>.`, p.queued.length > 1 ? "Reorder under “More”" : "")
    + stats
    + list(`Posted (${p.publishedCount})`, p.done.map((v) => row(v, "done", 0, 1)), "");
  window.__busy = d.pages.some(x => x.active.length);
}

async function refreshStats() {
  flash("Updating numbers…", false);
  const r = await api("/api/stats/refresh", { json: {} });
  flash(r.ok ? r.data.message : (r.data.error || "Could not update numbers."), !r.ok);
  await load();
}

function pick(id) { current = id; try { localStorage.setItem("page", id); } catch (_) {} render(); }

function watch(id) {
  const box = document.createElement("div");
  box.className = "modal";
  box.innerHTML = `<div class="modalbox"><video src="/api/videos/${id}/file" controls autoplay playsinline></video>
    <p><button class="ghost" style="width:100%">Close</button></p></div>`;
  box.addEventListener("click", (e) => { if (e.target === box || e.target.tagName === "BUTTON") box.remove(); });
  document.body.appendChild(box);
}

async function approve(id, isOwn) {
  if (isOwn && !confirm("Usually your friend approves this one. Approve it yourself anyway?")) return;
  await act(id, "approve", { decision: "approve" });
}

async function sendBack(id) {
  const note = prompt("What should change? (your friend will see this)");
  if (note === null) return;
  await act(id, "approve", { decision: "changes", note });
}

function setTime(id, current) {
  const box = document.createElement("div");
  box.className = "modal";
  const pad = (n) => String(n).padStart(2, "0");
  const d = current ? new Date(current) : new Date(Date.now() + 3600e3);
  const local = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  box.innerHTML = `<div class="modalbox card"><b>🗓 Post at a fixed date and time</b>
    <p class="small muted">Instead of the page's daily times. It still needs approval first.</p>
    <input type="datetime-local" value="${local}">
    <div class="acts" style="margin-top:12px"><button data-a="save">Save</button>
    ${current ? '<button class="ghost" data-a="auto">Back to daily times</button>' : ""}<button class="ghost" data-a="close">Cancel</button></div></div>`;
  box.addEventListener("click", async (e) => {
    const a = e.target.dataset && e.target.dataset.a;
    if (e.target === box || a === "close") return box.remove();
    if (a === "save") {
      const val = box.querySelector("input").value;
      if (!val) return;
      box.remove();
      await act(id, "schedule", { at: new Date(val).toISOString() });
    }
    if (a === "auto") { box.remove(); await act(id, "schedule", { at: null }); }
  });
  document.body.appendChild(box);
}

async function act(id, action, data = {}) {
  const r = await api(`/api/videos/${id}/${action}`, { json: data });
  if (!r.ok) flash(r.data.error || "Something went wrong.", true);
  else if (r.data.message) flash(r.data.message, false);
  await load();
}

async function load() {
  const r = await api("/api/dashboard");
  if (!r.ok) return;
  DATA = r.data; TZ = r.data.timezone;
  render();
}

(async () => {
  if (!(await requireUser())) return;
  showUrlMessages();
  await load();
  setInterval(() => { if (window.__busy && !document.querySelector("details[open]")) load(); }, 10000);
})();
</script>
</body>
</html>
